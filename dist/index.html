function fries(){return '<svg viewBox="0 0 400 280" role="img" aria-label="Batatas fritas"><g fill="#efb32b" stroke="#d8921f" stroke-width="4"><path d="M130 200L97 64L119 59L153 196ZM154 205L143 39L167 38L179 203ZM179 204L189 49L212 52L204 204ZM207 207L235 41L258 46L231 211ZM241 214L285 83L306 91L263 222Z"/></g><path d="M109 160L291 159L270 256L135 256Z" fill="#e2462c"/><path d="M119 171L280 170" stroke="#f8895b" stroke-width="4"/><text x="160" y="222" fill="#f5ecdc" font-family="Impact,sans-serif" font-size="31">MEKY’S</text></svg>';}
function mark(el){if(revisao){el.classList.add('review-flag');if(!el.querySelector('.confirm-label'))el.insertAdjacentHTML('beforeend',`<small class="confirm-label">${t('confirm')}</small>`);}}
function renderMenu(){const grid=$('#menuGrid');grid.innerHTML=DATA.menu.filter(p=>!filter||p.cat===filter).map(p=>`<article class="card" data-id="${p.id}"><div class="card-visual photo-slot"><!-- FOTO REAL: ${esc(p.name)} --><img alt="${esc(p.name)}">${p.cat===6?gin('m'+p.id):p.cat===5?fries():burger('m'+p.id)}${p.popular||p.vegan?`<span class="tag">${p.vegan?t('veganTag'):t('popular')}</span>`:''}</div><details class="card-details" ${innerWidth>700?'open':''}><summary><h3>${esc(p.name)}</h3></summary><p>${esc(t('desc')[p.desc])}</p></details><div class="card-bottom"><span class="price" data-todo="preco">— CVE</span><button class="add" data-add="${p.id}" aria-label="${t('add')} ${esc(p.name)}">+</button></div></article>`).join('');$$('.card').forEach(el=>{if(DATA.menu.find(p=>p.id==el.dataset.id).confirmado===false)mark(el.querySelector('summary'));});$('#filters').innerHTML=t('filters').map((s,i)=>`<button class="chip ${filter===i?'active':''}" data-filter="${i}" aria-pressed="${filter===i}">${s}</button>`).join('');}
function timeParts(){return Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Atlantic/Cape_Verde',hour:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(new Date()).map(p=>[p.type,p.value]));}
function renderHours(){const p=timeParts(),h=Number(p.hour),day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);$$('[data-hours]').forEach(el=>{el.textContent=t(h>=DATA.hours.open&&h<DATA.hours.close?'open':h<DATA.hours.open?'later':'closed')+' · '+t('hoursNote');mark(el)});$('#hours').innerHTML=t('days').map((d,i)=>`<div class="hours-row ${day===i?'today':''}"><span>${d}</span><span>13:00–23:00</span></div>`).join('');mark($('#hours'));}
function renderReview(){let r=DATA.reviews[reviewIndex];$('#quote').textContent='“'+r.quote+'”';$('#reviewStars').textContent=r.stars?'★★★★★':'';$('#translation').textContent=lang==='en'?'':t('translation')+': '+t('translations')[reviewIndex];$('#author').textContent=[r.name,r.source,new Intl.DateTimeFormat(lang,{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(r.date+'-15T12:00:00Z'))].filter(Boolean).join(' · ');$('#reviewIndex').textContent=String(reviewIndex+1).padStart(2,'0')+' / 04';$('#reviewStage').setAttribute('aria-label',t('reviews'));$('#prev').setAttribute('aria-label',t('prev'));$('#next').setAttribute('aria-label',t('next'));}
const icons={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',call:'<path d="M6 3l4 4-2 3q2 4 6 6l3-2 4 4q-2 5-7 2Q4 17 3 7Z"/>',whatsapp:'<path d="M20 11a8 8 0 01-12 7l-5 2 1-5a8 8 0 1116-4Z"/><path d="M8 7q0 7 7 7"/>',map:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1114 0Z"/><circle cx="12" cy="9" r="2"/>'};
function render(){document.documentElement.lang=lang;$('#language').value=lang;$('#heroVideo').setAttribute('aria-label',t('videoLabel'));$$('[data-i]').forEach(el=>el.innerHTML=t(el.dataset.i));$('[data-i="demo"]').textContent=t('demo')+DATA.proposal;$('#average').textContent=DATA.average;$('#address').textContent=DATA.address;$$('.map-link').forEach(a=>a.href=DATA.map);$('#payments').textContent=DATA.payment.value.join(' · ');$('#contacts').innerHTML=`<a href="tel:${DATA.phone.replace(/\s/g,'')}">${DATA.phone}</a><a data-uncertain href="tel:${DATA.mobile.value.replace(/\s/g,'')}">${DATA.mobile.value}</a><a data-uncertain href="mailto:${DATA.email.value}">${DATA.email.value}</a>`;$('#socials').innerHTML=`<a href="${DATA.instagram}" target="_blank" rel="noopener">Instagram ↗</a><a href="${DATA.facebook}" target="_blank" rel="noopener">Facebook ↗</a>`;$('#ticker').innerHTML=[...t('ticker'),...t('ticker')].map(x=>`<span>${x}</span><i>✳</i>`).join('');$('#mobileBar').innerHTML=['menu','call','whatsapp','map'].map(k=>`<a href="${k==='menu'?'#menu':k==='call'?'tel:'+DATA.phone.replace(/\s/g,''):k==='map'?DATA.map:'https://wa.me/'+DATA.mobile.value.replace(/\D/g,'')}" ${k==='map'||k==='whatsapp'?'target="_blank" rel="noopener"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg><span>${t(k)}</span></a>`).join('');renderMenu();renderHours();renderReview();$('#amenities').textContent=t('amenities');$('#wifi').textContent=t('wifi');$('#language').setAttribute('aria-label',t('languageLabel'));$('.map svg').setAttribute('aria-label',t('mapNote'));$('.map svg text').textContent=t('ocean');$$('[data-uncertain]').forEach(mark);$('#closeCart').setAttribute('aria-label',t('close'));$('#year').textContent=new Date().getFullYear();}
$('#ginArt').insertAdjacentHTML('afterbegin',gin('night'));

function renderCart(){const rows=Object.entries(cart).filter(([,q])=>q>0),count=rows.reduce((n,[,q])=>n+q,0);$('#cartFab').hidden=!count;$('#cartCount').textContent=count;$('#cartRows').innerHTML=rows.length?rows.map(([id,q])=>{const p=DATA.menu.find(p=>p.id==id);return `<div class="cart-row"><div><strong>${esc(p.name)}</strong><br><small data-todo="preco">— CVE</small></div><div class="quantity"><button data-quantity="${id}" data-delta="-1" aria-label="${t('remove')} ${esc(p.name)}">−</button><span>${q}</span><button data-quantity="${id}" data-delta="1" aria-label="${t('increase')} ${esc(p.name)}">+</button></div></div>`}).join(''):`<p class="empty">${t('empty')}</p>`;$('#sendOrder').hidden=!rows.length;const message=t('whatsappMessage')+'\n\n'+rows.map(([id,q])=>`${q} × ${DATA.menu.find(p=>p.id==id).name}`).join('\n')+'\n\n'+t('whatsappEnd');$('#sendOrder').href='https://wa.me/'+DATA.mobile.value.replace(/\D/g,'')+'?text='+encodeURIComponent(message);}

$('#language').addEventListener('change',e=>{lang=e.target.value;$$('.confirm-label').forEach(el=>el.remove());render();renderCart();const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState(null,'',u);});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;const old=new Map($$('.card').map(el=>[el.dataset.id,el.getBoundingClientRect()]));filter=Number(b.dataset.filter);renderMenu();if(!reduced)$$('.card').forEach(el=>{let before=old.get(el.dataset.id),after=el.getBoundingClientRect();el.animate(before?[{transform:`translate(${before.x-after.x}px,${before.y-after.y}px)`,opacity:.4},{transform:'none',opacity:1}]:[{transform:'translateY(18px)',opacity:0},{transform:'none',opacity:1}],{duration:350,easing:'ease-out'});});$('#filters').querySelector(`[data-filter="${filter}"]`).focus({preventScroll:true});});
$('#menuGrid').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart();notify(t('add')+' · '+DATA.menu.find(p=>p.id==b.dataset.add).name);});
$('#cartFab').addEventListener('click',()=>{renderCart();$('#cart').showModal();});$('#closeCart').addEventListener('click',()=>$('#cart').close());$('#cart').addEventListener('click',e=>{if(e.target===$('#cart')&&e.clientX<$('#cart').getBoundingClientRect().left)$('#cart').close();});$('#cartRows').addEventListener('click',e=>{const b=e.target.closest('[data-quantity]');if(!b)return;const id=b.dataset.quantity;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.delta));renderCart();});
$('#copy').addEventListener('click',async()=>{try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(DATA.address);notify(t('copied'));}catch{const area=document.createElement('textarea');area.value=DATA.address;area.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();if(ok)notify(t('copied'));else window.prompt(t('copyFallback'),DATA.address);}});
function stepReview(n){reviewIndex=(reviewIndex+n+DATA.reviews.length)%DATA.reviews.length;renderReview();if(!reduced)$('#quote').animate([{opacity:.25,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300});}
$('#prev').onclick=()=>stepReview(-1);$('#next').onclick=()=>stepReview(1);$('#reviewStage').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepReview(e.key==='ArrowRight'?1:-1)}});let touchX=0;$('#reviewStage').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;reviewPaused=true},{passive:true});$('#reviewStage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>40)stepReview(dx<0?1:-1)},{passive:true});$('#reviewStage').addEventListener('mouseenter',()=>reviewPaused=true);$('#reviewStage').addEventListener('mouseleave',()=>reviewPaused=false);$('#reviewStage').addEventListener('focusin',()=>reviewPaused=true);$('#reviewStage').addEventListener('focusout',()=>reviewPaused=false);if(!reduced)setInterval(()=>{if(!reviewPaused&&!document.hidden&&$('#reviewStage').getBoundingClientRect().top<innerHeight&&$('#reviewStage').getBoundingClientRect().bottom>0)stepReview(1)},6500);
let ticking=false;function scrollEffects(){const y=scrollY;$('header').classList.toggle('compact',y>50);if(!reduced){const progress=Math.min(1,y/650);$$('#heroBurger .part').forEach(el=>el.style.setProperty('--shift',((Number(el.dataset.layer)-2.5)*progress*29)+'px'));const r=$('#night').getBoundingClientRect();$('#night').style.setProperty('--night',Math.max(0,Math.min(1,(innerHeight-r.top)/(innerHeight*.8))));}ticking=false;}addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(scrollEffects);ticking=true}},{passive:true});scrollEffects();
if(!reduced&&matchMedia('(hover:hover)').matches){$('#menuGrid').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.querySelector('.card-visual').style.transform=`perspective(800px) rotateY(${((e.clientX-r.left)/r.width-.5)*5}deg)`}});$('#menuGrid').addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.querySelector('.card-visual').style.transform='none'});}
const countObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(!e.isIntersecting)return;countObserver.unobserve(e.target);const end=Number(e.target.dataset.count),start=performance.now();function frame(now){const p=Math.min(1,(now-start)/1100);e.target.textContent=(end===4.6?end*p:Math.round(end*p)).toLocaleString(lang,{maximumFractionDigits:end===4.6?1:0,minimumFractionDigits:end===4.6?1:0});if(p<1)requestAnimationFrame(frame)}if(!reduced)requestAnimationFrame(frame)}),{threshold:.5});$$('[data-count]').forEach(el=>countObserver.observe(el));
function updatePhoto(img){img.closest('.photo-slot').classList.toggle('has-photo',!!img.getAttribute('src')&&img.complete&&img.naturalWidth>0)}$$('.photo-slot>img').forEach(img=>{img.addEventListener('load',()=>updatePhoto(img));img.addEventListener('error',()=>{img.closest('.photo-slot').classList.remove('has-photo');img.style.display='none'});updatePhoto(img)});
document.addEventListener('load',e=>{if(e.target.matches?.('.photo-slot>img'))updatePhoto(e.target)},true);setInterval(renderHours,60000);renderCart();if(params.has('menu'))requestAnimationFrame(()=>{document.documentElement.style.scrollBehavior='auto';$('#menu').scrollIntoView();requestAnimationFrame(()=>document.documentElement.style.scrollBehavior='')});


const heroVideo=$('#heroVideo');const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
heroVideo.muted=true;heroVideo.defaultPlaybackRate=0.5;heroVideo.playbackRate=0.5;heroVideo.addEventListener('loadedmetadata',()=>{heroVideo.playbackRate=0.5;});
